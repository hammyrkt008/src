openapi: 3.0.3
info:
  title: API de Gestion de voitures
  description: Spécification d'une API RESTful pour la gestion de voitures
  version: 1.0.0
components: 
  schemas:
    voitures:
      type: object
      properties:
        id:
          type: integer
        marque:
          type: string
        modèle:
          type: string
      Modèles:
        allOf:
          - type: object
            required:
              - id
            properties:
              id:
                type: integer
                example: 101
          - $ref: '#/components/schemas/voitures'




paths:
  /voitures:
    get:
      summary: Récupérer la liste des voitures
      description: Renvoie la collection des modèles avec gestion de la marque.
      parameters:
        - name: marque
          in: query
          required: true
          description: Numéro de la marque de la voiture.
          schema:
            type: string
            default: ford
            minimum: 1
        - name: modèles
          in: query
          required: true
          description: modèles de la voiture à retourner.
          schema:
            type: string
            default: T
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          description: Numéro de la page courante demandée.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per-pages
          in: query
          required: false
          description: Nombre de modèles à retourner par page.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100

      responses:
        '200':
          description: Liste des modèle.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/voitures'
                example:
                  - id: 1
                    marque: "Ford"
                    modèles: "T"
                    published: true
                  - id: 2
                    marque: "Opel"
                    modèles: "Corsa"
                    published: false

    post:
      summary: Créer un nouveau modèles
      description: Ajoute le modèles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: le modèle à ajouter.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/voitures'
      responses:
        '201':
          description: Modèles ajouter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voitures'
    delete:
      summary: Delete orderdays by id
      security:
        - bearerAuth: [] 
      responses:
        '204':
          description: Deleted
        '404':
          description: id not found

