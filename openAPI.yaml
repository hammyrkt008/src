openapi: 3.0.3
info:
  title: API de Gestion de voitures
  description: Spécification d'une API RESTful pour la gestion de voitures
  version: 1.0.0
components: 
  schemas:
     voitures:
      type: object
      properties:
        id:
          type: integer
        marque:
          type: string
        modèle:
          type: string



paths:
  /voitures:
    get:
      summary: Récupérer la liste des voitures
      description: Renvoie la collection des modèles avec gestion de la marque.
      parameters:
        - name: marque
          in: query
          required: true
          description: Numéro de la marque de la voiture.
          schema:
            type: string
            default: ford
            minimum: 1
        - name: modèles
          in: query
          required: true
          description: modèles de la voiture à retourner.
          schema:
            type: string
            default: T
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste des modèle.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/voitures'
                example:
                  - id: 1
                    marque: "Ford"
                    modèles: "T"
                    published: true
                  - id: 2
                    marque: "Opel"
                    modèles: "Corsa"
                    published: false

    post:
      summary: Créer un nouveau modèles
      description: Ajoute le modèles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: le modèle à ajouter.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/voitures'
      responses:
        '201':
          description: Modèles ajouter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voitures'
    delete:
      summary: Delete orderdays by id
      security:
        - bearerAuth: []

      parameters: 
        - name 
      responses:
        '204':
          description: Deleted
        '404':
          description: id not found
