openapi: 3.0.3
info:
  title: API de Gestion de voitures
  description: Spécification d'une API RESTful pour la gestion de voitures
  version: 1.0.0

paths:
  /articles:
    get:
      summary: Récupérer la liste des voitures
      description: Renvoie la collection des modèles avec gestion de la marque.
      parameters:
        - name: marque
          in: query
          required: true
          description: Numéro de la marque de la voiture.
          schema:
            type: string
            default: ford
            minimum: 1
        - name: modèles
          in: query
          required: true
          description: modèles de la voiture à retourner.
          schema:
            type: string
            default: T
            minimum: 1
            maximum: 100
